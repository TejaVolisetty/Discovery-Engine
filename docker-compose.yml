services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: discovery-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CONSENT_REQUIRED=true
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: discovery-frontend
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: discovery-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
